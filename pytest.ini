[pytest]
# The genuine automated suite lives in tests/. Scoping collection here keeps
# pytest from importing the standalone demonstration scripts at the repo root
# (test_self_heal.py) and inside actions/ (test_action.py), which carry an
# intentional ZeroDivisionError used to exercise the live self-healing engine
# and are run directly via `python test_self_heal.py`, not collected as tests.
testpaths = tests
